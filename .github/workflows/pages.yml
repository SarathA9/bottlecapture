name: Test and deploy BottleCapture
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # Give every module URL the commit ID, so phones never run a stale cached copy.
      - name: Stamp version
        run: |
          v=${GITHUB_SHA::7}
          sed -i -E "s#(from \"\./[a-z]+\.js)\"#\1?v=$v\"#g" dist/*.js
          sed -i -E "s#(src=\"app\.js)\"#\1?v=$v\"#; s#(href=\"style\.css)\"#\1?v=$v\"#" dist/index.html
          sed -i "s#__BUILD__#$v#" dist/app.js
          grep -c "?v=$v" dist/app.js dist/drive.js dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
